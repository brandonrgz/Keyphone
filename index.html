<html lang="es">
<head>

<title>KEYPHONE SOLUTIONS | Taller</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#172033;--muted:#6b7588;--line:#e4e9f1;--accent:#3867f4;--accent2:#244bd1;--soft:#edf2ff;--danger:#d83b52;--good:#16835d;--warn:#ad6a00;--shadow:0 8px 28px rgba(27,43,77,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;font-weight:650;background:var(--accent);color:#fff}button:hover{filter:brightness(.97)}button.secondary{background:var(--soft);color:var(--accent)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.danger{background:#fff0f2;color:var(--danger)}button.small{padding:6px 9px;font-size:12px;border-radius:8px}.shell{display:flex;min-height:100vh}.sidebar{width:248px;background:#101827;color:#e9eef8;padding:22px 14px;display:flex;flex-direction:column;gap:22px;flex-shrink:0}.brand{padding:0 10px}.brand-mark{width:38px;height:38px;display:grid;place-items:center;background:#3867f4;border-radius:12px;font-weight:900;font-size:19px;margin-bottom:10px}.brand h1{font-size:15px;letter-spacing:.5px;margin:0}.brand p{font-size:12px;color:#9eabc2;margin:5px 0}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#aeb9cd;text-align:left;padding:11px 12px;font-weight:550;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:#202d43;color:#fff}.nav .ico{width:20px;text-align:center}.sidebar-bottom{margin-top:auto;color:#8d9ab1;font-size:12px;padding:10px}.main{min-width:0;flex:1}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--panel);border-bottom:1px solid var(--line);gap:12px}.topbar h2{font-size:20px;margin:0}.top-actions{display:flex;align-items:center;gap:10px}.userpill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-weight:800}.content{padding:26px;max-width:1500px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}.pagehead h3{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:28px;font-weight:800;margin:7px 0 4px;letter-spacing:-.6px}.stat .foot{font-size:12px;color:var(--muted)}.section-title{font-size:16px;margin:0 0 14px}.two{grid-template-columns:1.2fr .8fr}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{max-width:100%;min-width:150px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #3867f41c}.field textarea{min-height:80px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.span2{grid-column:1/-1}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;min-width:650px;background:var(--panel)}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:5px 9px;border-radius:30px;font-size:11px;font-weight:750;background:#eef1f6;color:#5c6678}.pill.green{background:#e5f7ef;color:#14754f}.pill.blue{background:#eaf0ff;color:#2f59d6}.pill.orange{background:#fff3dd;color:#986000}.pill.red{background:#ffeaee;color:#bd2941}.empty{padding:28px;text-align:center;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.notice{padding:13px 14px;border-radius:12px;background:#fff5de;color:#805500;font-size:13px;margin-bottom:16px}.notice.blue{background:#edf3ff;color:#3153a8}.activity{display:grid;gap:13px}.activity-item{display:flex;gap:11px;align-items:flex-start}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}.activity-item strong{display:block;font-size:13px}.activity-item span{font-size:12px;color:var(--muted)}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#0d172b77;display:grid;place-items:center;padding:14px;z-index:10}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:18px;padding:22px;box-shadow:0 25px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0;font-size:20px}.close{background:transparent;color:var(--muted);font-size:24px;padding:0 5px}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#dce6ff,transparent 40%),var(--bg)}.loginbox{width:min(440px,100%);background:var(--panel);padding:28px;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow)}.loginlogo{display:flex;align-items:center;gap:12px;margin-bottom:25px}.loginlogo .brand-mark{margin:0}.loginbox h2{margin:0 0 5px;font-size:24px}.loginbox>p{color:var(--muted);font-size:13px;margin:0 0 22px}.loginbox .field{margin-bottom:14px}.loginfoot{font-size:12px;color:var(--muted);margin-top:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101827;color:#fff;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:30;font-size:13px;max-width:90vw}.muted{color:var(--muted)}.right{display:flex;gap:8px;align-items:center}.mobile-menu{display:none}.evidence-list{display:flex;gap:8px;flex-wrap:wrap}.evidence-list a{font-size:12px}.footnote{font-size:12px;color:var(--muted);margin-top:12px}.theme-dark{--bg:#111827;--panel:#1b2535;--text:#edf2fa;--muted:#9ba8bc;--line:#2e3a4e;--soft:#25365d;--accent:#6689ff;--accent2:#4f73e9;--shadow:0 8px 28px rgba(0,0,0,.14)}.theme-dark .sidebar{background:#0a101c}.theme-dark th{background:#141d2c}.theme-dark .notice{background:#3d321b;color:#ffdb83}.theme-dark .notice.blue{background:#1f2c4b;color:#b9cbff}.theme-dark .pill.green{background:#153d31;color:#8ce2bc}.theme-dark .pill.blue{background:#25365d;color:#b8caff}.theme-dark .pill.orange{background:#48371b;color:#ffd78c}.theme-dark .pill.red{background:#4c2530;color:#ffb7c3}
@media(max-width:900px){.sidebar{width:210px}.content{padding:18px}.topbar{padding:0 18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:650px){.shell{display:block}.sidebar{width:auto;padding:12px;display:block}.brand{display:flex;align-items:center;gap:10px;padding:0 3px 10px}.brand-mark{margin:0;width:34px;height:34px;flex-shrink:0}.brand p{margin:2px 0}.nav{display:flex;overflow:auto;gap:5px;padding-bottom:2px}.nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.nav .ico{width:auto}.sidebar-bottom{display:none}.topbar{height:62px;padding:0 14px}.topbar h2{font-size:17px}.top-actions .userpill span:last-child{display:none}.content{padding:14px}.pagehead h3{font-size:21px}.stats{gap:10px}.stat{padding:14px}.stat .value{font-size:24px}.stat .label{font-size:12px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.toolbar>*{flex:1;min-width:120px}.card{padding:15px}}
</style>

<body>
<div id="app"></div>
<div id="modalroot"></div>
<div id="toastroot"></div>
<script>
(function(){
'use strict';
const KEY='keyphone_taller_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString();
const datefmt=s=>s?new Date(s).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}):'—';
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0);
const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const statuses=['Recibido','En diagnóstico','Esperando autorización','Esperando refacción','En reparación','Listo para entregar','Entregado','Sin reparación'];
const state={page:'dashboard',search:'',filter:'Todos',user:null,modal:null};
function fresh(){return {settings:{shop:'KEYPHONE SOLUTIONS',theme:'light'},users:[{id:'U-ADMIN',name:'Administrador',username:'admin',password:'admin123',role:'admin',active:true,created:now()}],orders:[],inventory:[],clients:[],activity:[]}}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&d.users)return d}catch(e){}return fresh()}
let db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('No se pudieron guardar los datos. Exporta un respaldo y libera espacio.');return false}}
function log(msg){db.activity.unshift({msg,at:now()});db.activity=db.activity.slice(0,30);save()}
function toast(msg){$('#toastroot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastroot').innerHTML='',3000)}
function isAdmin(){return state.user&&state.user.role==='admin'}
function can(page){return isAdmin()||!['users','settings','delete'].includes(page)}
function setTheme(){document.body.classList.toggle('theme-dark',db.settings.theme==='dark')}
function render(){setTheme();if(!state.user){renderLogin();return}renderApp()}
function renderLogin(){
$('#app').innerHTML=`<div class="loginwrap"><div class="loginbox"><div class="loginlogo"><div class="brand-mark">K</div><div><b>KEYPHONE SOLUTIONS</b><div class="sub">Gestión inteligente de taller</div></div></div><h2>Bienvenido</h2><p>Inicia sesión para administrar tu taller.</p><form id="loginform"><div class="field"><label>USUARIO</label><input name="username" autocomplete="username" required placeholder="Tu usuario"></div><div class="field"><label>CONTRASEÑA</label><input name="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña"></div><button style="width:100%">Iniciar sesión</button></form><div class="loginfoot">Primera entrada: usuario <b>admin</b> · contraseña <b>admin123</b><br>Cámbiala desde Usuarios después de ingresar. Los datos quedan en este navegador.</div><div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px"><button class="secondary" style="width:100%" id="publiccheck">Consultar estado de una orden</button></div></div></div>`;
$('#loginform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),u=db.users.find(x=>x.username.toLowerCase()===String(f.get('username')).toLowerCase()&&x.password===f.get('password')&&x.active);if(!u){toast('Usuario, contraseña incorrectos o cuenta desactivada');return}state.user=u;log('Inicio de sesión: '+u.name);render()};
$('#publiccheck').onclick=()=>openPublicLookup();
}
function renderApp(){
const nav=[['dashboard','▦','Resumen'],['orders','▤','Órdenes de trabajo'],['wholesale','▧','Clientes mayoristas'],['inventory','▥','Inventario'],['clients','♙','Clientes'],['users','♧','Usuarios y permisos'],['settings','⚙','Configuración']];
const navhtml=nav.filter(n=>can(n[0])).map(n=>`<button class="${state.page===n[0]?'active':''}" data-page="${n[0]}"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('');
$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">K</div><div><h1>KEYPHONE SOLUTIONS</h1><p>Panel de taller</p></div></div><nav class="nav">${navhtml}</nav><div class="sidebar-bottom">Modo local · Datos en este navegador<br>Versión inicial 1.0</div></aside><main class="main"><header class="topbar"><h2>${esc(({dashboard:'Resumen',orders:'Órdenes de trabajo',wholesale:'Recepción mayorista',inventory:'Inventario',clients:'Clientes',users:'Usuarios y permisos',settings:'Configuración'})[state.page]||'Taller')}</h2><div class="top-actions"><button class="secondary small" id="themebtn">${db.settings.theme==='dark'?'☀ Tema claro':'☾ Tema oscuro'}</button><div class="userpill"><div class="avatar">${esc((state.user.name||'U').slice(0,1).toUpperCase())}</div><span>${esc(state.user.name)}</span></div><button class="ghost small" id="logout">Salir</button></div></header><section class="content" id="pagecontent"></section></main></div>`;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.search='';renderApp()});
$('#themebtn').onclick=()=>{db.settings.theme=db.settings.theme==='dark'?'light':'dark';save();renderApp()};
$('#logout').onclick=()=>{state.user=null;render()};
const p=$('#pagecontent');({dashboard:dashboard,orders:ordersPage,wholesale:wholesalePage,inventory:inventoryPage,clients:clientsPage,users:usersPage,settings:settingsPage}[state.page]||dashboard)(p);
}
function dashboard(p){
const open=db.orders.filter(o=>!['Entregado','Sin reparación'].includes(o.status)).length, ready=db.orders.filter(o=>o.status==='Listo para entregar').length, low=db.inventory.filter(i=>Number(i.qty)<=Number(i.min)).length, due=db.orders.reduce((s,o)=>s+Math.max(0,Number(o.total||0)-Number(o.paid||0)),0);
p.innerHTML=`<div class="pagehead"><div><h3>Hola, ${esc(state.user.name.split(' ')[0])} 👋</h3><div class="sub">Aquí tienes el resumen de la actividad de tu taller.</div></div><button id="neworder">＋ Nueva orden</button></div><div class="grid stats"><div class="stat"><div class="label">Órdenes activas</div><div class="value">${open}</div><div class="foot">Equipos en proceso</div></div><div class="stat"><div class="label">Listos para entregar</div><div class="value">${ready}</div><div class="foot">Pendientes de recoger</div></div><div class="stat"><div class="label">Productos por reponer</div><div class="value">${low}</div><div class="foot">En mínimo o debajo del mínimo</div></div><div class="stat"><div class="label">Saldo por cobrar</div><div class="value" style="font-size:23px">${money(due)}</div><div class="foot">Según órdenes registradas</div></div></div><div class="grid two"><div class="card"><div class="pagehead"><div><h4 class="section-title">Órdenes recientes</h4><div class="sub">Últimos equipos registrados</div></div><button class="secondary small" id="allorders">Ver todas</button></div>${orderTable(db.orders.slice().sort((a,b)=>b.created.localeCompare(a.created)).slice(0,5),false)}</div><div class="card"><h4 class="section-title">Actividad reciente</h4><div class="activity">${db.activity.slice(0,7).map(a=>`<div class="activity-item"><div class="dot"></div><div><strong>${esc(a.msg)}</strong><span>${datefmt(a.at)}</span></div></div>`).join('')||'<div class="empty">Aún no hay actividad registrada.</div>'}</div></div></div><div class="notice blue" style="margin-top:16px">🔒 <b>Almacenamiento local:</b> la información se guarda en este navegador y dispositivo. Usa Configuración para exportar respaldos periódicos.</div>`;
$('#neworder').onclick=()=>openOrder();$('#allorders').onclick=()=>{state.page='orders';renderApp()};
}
function orderTable(items,showActions=true){if(!items.length)return '<div class="empty">No hay órdenes registradas todavía.</div>';return `<div class="tablewrap"><table><thead><tr><th>N.º orden</th><th>Cliente / equipo</th><th>Estado</th><th>Fecha</th>${showActions?'<th>Acciones</th>':''}</tr></thead><tbody>${items.map(o=>`<tr><td><b>${esc(o.number)}</b></td><td>${esc(o.customer)}<div class="sub">${esc(o.device)} · ${esc(o.brand||'')}</div></td><td>${statusPill(o.status)}</td><td>${datefmt(o.created)}</td>${showActions?`<td><div class="actions"><button class="secondary small" data-view="${o.id}">Ver</button><button class="ghost small" data-edit="${o.id}">Editar</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function statusPill(s){let c=['Listo para entregar','Entregado'].includes(s)?'green':['En reparación','En diagnóstico'].includes(s)?'blue':['Esperando autorización','Esperando refacción'].includes(s)?'orange':s==='Sin reparación'?'red':'';return `<span class="pill ${c}">${esc(s)}</span>`}
function bindOrderActions(root=document){root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>viewOrder(b.dataset.view));root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOrder(b.dataset.edit))}
function ordersPage(p){
p.innerHTML=`<div class="pagehead"><div><h3>Órdenes de trabajo</h3><div class="sub">Registra diagnósticos, reparaciones, evidencias y pagos.</div></div><button id="neworder">＋ Crear orden</button></div><div class="toolbar"><input id="ordersearch" placeholder="Buscar orden, cliente, teléfono o equipo..." value="${esc(state.search)}"><select id="orderfilter">${['Todos',...statuses].map(s=>`<option ${state.filter===s?'selected':''}>${esc(s)}</option>`).join('')}</select><button class="secondary" id="lookup">Vista cliente</button></div><div id="ordertable">${orderTable(filterOrders())}</div><div class="footnote">Las evidencias seleccionadas se guardan en este navegador. El almacenamiento del navegador tiene límites; exporta respaldos con frecuencia.</div>`;
$('#neworder').onclick=()=>openOrder();$('#lookup').onclick=()=>openPublicLookup();$('#ordersearch').oninput=e=>{state.search=e.target.value;$('#ordertable').innerHTML=orderTable(filterOrders());bindOrderActions($('#ordertable'))};$('#orderfilter').onchange=e=>{state.filter=e.target.value;$('#ordertable').innerHTML=orderTable(filterOrders());bindOrderActions($('#ordertable'))};bindOrderActions(p);
}
function filterOrders(){let q=state.search.toLowerCase();return db.orders.filter(o=>(state.filter==='Todos'||o.status===state.filter)&&[o.number,o.customer,o.phone,o.device,o.brand,o.serial].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>b.created.localeCompare(a.created))}
function openOrder(id=null,pre={}){const old=db.orders.find(o=>o.id===id);if(old&&!isAdmin()&&old.createdBy!==state.user.id){toast('Solo puedes editar tus propias órdenes');return}const o=old||{id:'O-'+uid(),number:'KP-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-5),customer:pre.customer||'',phone:pre.phone||'',device:pre.device||'Celular',brand:'',model:'',serial:'',problem:'',diagnosis:'',status:'Recibido',total:'',paid:'',notes:'',evidence:[],created:now(),createdBy:state.user.id,assigned:state.user.name,wholesale:!!pre.wholesale};
showModal(`${old?'Editar':'Nueva'} orden de trabajo`, `<form id="orderform"><div class="formgrid"><div class="field"><label>NÚMERO DE ORDEN</label><input name="number" value="${esc(o.number)}" required></div><div class="field"><label>ESTADO</label><select name="status">${statuses.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>CLIENTE *</label><input name="customer" value="${esc(o.customer)}" required></div><div class="field"><label>TELÉFONO / WHATSAPP</label><input name="phone" value="${esc(o.phone)}" inputmode="tel" placeholder="Ej. 5215512345678"></div><div class="field"><label>TIPO DE EQUIPO</label><select name="device">${['Celular','Tablet','Computadora','Laptop','Consola','Otro'].map(s=>`<option ${o.device===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>MARCA</label><input name="brand" value="${esc(o.brand)}" placeholder="Apple, Samsung, HP..."></div><div class="field"><label>MODELO</label><input name="model" value="${esc(o.model)}"></div><div class="field"><label>IMEI / N.º SERIE</label><input name="serial" value="${esc(o.serial)}"></div><div class="field span2"><label>FALLA REPORTADA *</label><textarea name="problem" required>${esc(o.problem)}</textarea></div><div class="field span2"><label>DIAGNÓSTICO / TRABAJO REALIZADO</label><textarea name="diagnosis">${esc(o.diagnosis)}</textarea></div><div class="field"><label>COSTO TOTAL (MXN)</label><input name="total" type="number" min="0" step=".01" value="${esc(o.total)}"></div><div class="field"><label>ANTICIPO / PAGADO (MXN)</label><input name="paid" type="number" min="0" step=".01" value="${esc(o.paid)}"></div><div class="field"><label>TÉCNICO ASIGNADO</label><select name="assigned">${db.users.filter(u=>u.active&&u.role==='tech').map(u=>`<option ${o.assigned===u.name?'selected':''}>${esc(u.name)}</option>`).concat(`<option ${!db.users.some(u=>u.name===o.assigned&&u.role==='tech')?'selected':''}>${esc(o.assigned||state.user.name)}</option>`).join('')}</select></div><div class="field"><label>EVIDENCIAS (FOTOS / ARCHIVOS)</label><input name="evidence" type="file" accept="image/*,video/*,.pdf" multiple></div><div class="field span2"><label>NOTAS INTERNAS</label><textarea name="notes">${esc(o.notes)}</textarea></div></div><div class="notice blue">Las imágenes se guardan localmente junto a la orden. Para evitar exceder el espacio del navegador, procura subir fotos comprimidas.</div><div class="actions"><button type="submit">${old?'Guardar cambios':'Crear orden'}</button><button type="button" class="ghost" id="cancelmodal">Cancelar</button></div></form>`);
$('#cancelmodal').onclick=closeModal;$('#orderform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const number=String(f.get('number')).trim();if(db.orders.some(x=>x.number===number&&x.id!==o.id)){toast('Ese número de orden ya existe');return}const files=Array.from(e.target.elements.evidence.files||[]);let evidence=(o.evidence||[]).slice();try{for(const file of files){if(file.size>2*1024*1024){toast('Archivo mayor a 2 MB omitido: '+file.name);continue}const data=await fileToData(file);evidence.push({name:file.name,type:file.type,data,at:now()})}}catch(err){toast('No se pudo cargar una evidencia');}
Object.assign(o,{number,customer:f.get('customer').trim(),phone:String(f.get('phone')||'').trim(),device:f.get('device'),brand:f.get('brand'),model:f.get('model'),serial:f.get('serial'),problem:f.get('problem'),diagnosis:f.get('diagnosis'),status:f.get('status'),total:Number(f.get('total')||0),paid:Number(f.get('paid')||0),assigned:f.get('assigned'),notes:f.get('notes'),evidence,updated:now()});if(!old)db.orders.unshift(o);let c=db.clients.find(c=>c.phone&&c.phone===o.phone);if(!c){db.clients.push({id:'C-'+uid(),name:o.customer,phone:o.phone,created:now()})}else c.name=o.customer;save();log((old?'Actualizó':'Creó')+' orden '+o.number);closeModal();renderApp();toast('Orden guardada');};
}
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function viewOrder(id){const o=db.orders.find(x=>x.id===id);if(!o)return;const evidence=(o.evidence||[]).map((e,i)=>`<div class="evidence-list"><a href="${e.data}" target="_blank" rel="noopener">${esc(e.name)}</a><span class="muted">${esc(e.type||'archivo')}</span>${isAdmin()?`<button class="danger small" data-delevidence="${i}">Quitar</button>`:''}</div>`).join('')||'<span class="muted">Sin evidencias adjuntas.</span>';
showModal('Orden '+o.number,`<div class="grid two"><div><div class="sub">CLIENTE</div><b>${esc(o.customer)}</b><div class="sub" style="margin-top:12px">EQUIPO</div><b>${esc([o.brand,o.model,o.device].filter(Boolean).join(' '))}</b><div class="sub" style="margin-top:12px">FALLA REPORTADA</div><p>${esc(o.problem||'—')}</p><div class="sub">DIAGNÓSTICO / REPARACIÓN</div><p>${esc(o.diagnosis||'—')}</p><div class="sub">NOTAS</div><p>${esc(o.notes||'—')}</p></div><div><div class="sub">ESTADO</div><p>${statusPill(o.status)}</p><div class="sub">FECHA DE RECEPCIÓN</div><p>${datefmt(o.created)}</p><div class="sub">TÉCNICO</div><p>${esc(o.assigned||'—')}</p><div class="sub">TOTAL / PAGADO / SALDO</div><p><b>${money(o.total)} / ${money(o.paid)} / ${money(Math.max(0,o.total-o.paid))}</b></p><div class="sub">EVIDENCIAS</div><div style="display:grid;gap:8px;margin-top:8px">${evidence}</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="actions"><button id="waorder" class="secondary">Abrir WhatsApp</button><button id="printorder" class="ghost">Imprimir / guardar PDF</button>${isAdmin()?'<button id="delorder" class="danger">Eliminar orden</button>':''}<button id="closeview" class="ghost">Cerrar</button></div><div class="footnote">WhatsApp abre un mensaje preparado para que lo revises y envíes manualmente. No envía mensajes en segundo plano.</div>`);
$('#closeview').onclick=closeModal;$('#printorder').onclick=()=>window.print();$('#waorder').onclick=()=>whatsappOrder(o);if(isAdmin())$('#delorder').onclick=()=>{if(confirm('¿Eliminar definitivamente esta orden y sus evidencias?')){db.orders=db.orders.filter(x=>x.id!==o.id);save();log('Eliminó orden '+o.number);closeModal();renderApp();toast('Orden eliminada')}};
document.querySelectorAll('[data-delevidence]').forEach(b=>b.onclick=()=>{if(confirm('¿Quitar esta evidencia?')){o.evidence.splice(Number(b.dataset.delevidence),1);save();closeModal();viewOrder(id)}});
}
function whatsappOrder(o){if(!o.phone){toast('Agrega el teléfono del cliente en la orden');return}const phone=o.phone.replace(/\D/g,'');const msg=`Hola ${o.customer}, te contactamos de ${db.settings.shop}. Tu orden ${o.number} (${o.device} ${o.brand||''} ${o.model||''}) está en estado: ${o.status}. ${o.status==='Listo para entregar'?'Tu equipo está listo para recoger.':''} Cualquier duda, responde este mensaje.`;window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank','noopener')}
function openPublicLookup(){showModal('Consulta el estado de tu equipo',`<p class="sub">Escribe el número de orden que te entregó el taller.</p><form id="publicform"><div class="field"><label>NÚMERO DE ORDEN</label><input name="number" required placeholder="Ej. KP-2026-12345"></div><button>Consultar estado</button></form><div id="publicresult" style="margin-top:16px"></div><div class="footnote">Esta consulta solo busca órdenes guardadas en este mismo dispositivo. Para consulta pública desde el teléfono del cliente, se requiere publicar un portal conectado a una base de datos en línea.</div>`);$('#publicform').onsubmit=e=>{e.preventDefault();const n=new FormData(e.target).get('number').trim().toLowerCase(),o=db.orders.find(x=>x.number.toLowerCase()===n);$('#publicresult').innerHTML=o?`<div class="card"><div class="sub">ORDEN ${esc(o.number)}</div><h3 style="margin:5px 0">${esc(o.device)} · ${esc([o.brand,o.model].filter(Boolean).join(' '))}</h3><p>Estado actual: ${statusPill(o.status)}</p><p class="sub">Última actualización: ${datefmt(o.updated||o.created)}</p><p>${o.status==='Listo para entregar'?'Tu equipo está listo para recoger.':o.status==='Entregado'?'El equipo figura como entregado.':'El taller está trabajando en tu equipo. Puedes volver a consultar más tarde.'}</p></div>`:'<div class="notice">No encontramos una orden con ese número en este dispositivo.</div>'}}
function wholesalePage(p){const wholesalers=db.clients.filter(c=>c.wholesale);p.innerHTML=`<div class="pagehead"><div><h3>Recepción de clientes mayoristas</h3><div class="sub">Captura varios equipos de un mismo distribuidor en una sola operación.</div></div><button id="batch">＋ Nueva recepción por lote</button></div><div class="notice blue">Cada equipo genera una orden individual para mantener seguimiento y estado por separado.</div><div class="card"><h4 class="section-title">Lotes recientes</h4>${db.orders.filter(o=>o.wholesale).length?orderTable(db.orders.filter(o=>o.wholesale).sort((a,b)=>b.created.localeCompare(a.created)),true):'<div class="empty">Todavía no hay equipos mayoristas registrados.</div>'}</div>`;$('#batch').onclick=()=>openBatch();bindOrderActions(p)}
function openBatch(){showModal('Recepción mayorista por lote',`<form id="batchform"><div class="formgrid"><div class="field"><label>EMPRESA / CLIENTE MAYORISTA *</label><input name="customer" required></div><div class="field"><label>WHATSAPP DE CONTACTO</label><input name="phone" inputmode="tel"></div><div class="field span2"><label>DATOS DE LOS EQUIPOS (UNO POR LÍNEA) *</label><textarea name="devices" required style="min-height:150px" placeholder="iPhone 13 | No enciende&#10;Samsung A54 | Centro de carga&#10;HP ProBook | No da imagen"></textarea></div><div class="field"><label>ESTADO INICIAL</label><select name="status">${statuses.slice(0,5).map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>NOTA GENERAL DEL LOTE</label><input name="notes" placeholder="Referencia de lote, bolsa, etc."></div></div><p class="sub">Formato por línea: modelo o equipo | falla reportada. Puedes registrar hasta 100 equipos por lote.</p><button>Crear órdenes del lote</button></form>`);$('#batchform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),customer=String(f.get('customer')).trim(),phone=String(f.get('phone')).trim(),lines=String(f.get('devices')).split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length||lines.length>100){toast('Agrega entre 1 y 100 equipos');return}lines.forEach(line=>{const bits=line.split('|');const deviceName=(bits[0]||'Equipo').trim(),problem=(bits.slice(1).join('|')||'Pendiente de diagnóstico').trim();db.orders.unshift({id:'O-'+uid(),number:'KP-'+new Date().getFullYear()+'-'+String(Date.now()+Math.floor(Math.random()*999)).slice(-5),customer,phone,device:/laptop|hp|computadora|pc|macbook/i.test(deviceName)?'Computadora':/ipad|tablet|tab /i.test(deviceName)?'Tablet':'Celular',brand:'',model:deviceName,serial:'',problem,diagnosis:'',status:f.get('status'),total:0,paid:0,notes:String(f.get('notes')||''),evidence:[],created:now(),createdBy:state.user.id,assigned:state.user.name,wholesale:true})});let c=db.clients.find(x=>x.phone===phone&&phone);if(!c)db.clients.push({id:'C-'+uid(),name:customer,phone,wholesale:true,created:now()});else{c.name=customer;c.wholesale=true}save();log('Recepción mayorista: '+lines.length+' equipos para '+customer);closeModal();renderApp();toast('Se crearon '+lines.length+' órdenes')}}
function inventoryPage(p){p.innerHTML=`<div class="pagehead"><div><h3>Inventario</h3><div class="sub">Control de refacciones, accesorios y consumibles.</div></div><button id="addstock">＋ Agregar producto</button></div><div class="toolbar"><input id="stocksearch" placeholder="Buscar por nombre, SKU o categoría..."><select id="stockfilter"><option>Todos</option><option>Bajo mínimo</option></select></div><div id="stocktable">${stockTable(db.inventory)}</div>`;$('#addstock').onclick=()=>openStock();function refresh(){const q=$('#stocksearch').value.toLowerCase(),f=$('#stockfilter').value;$('#stocktable').innerHTML=stockTable(db.inventory.filter(i=>(f==='Todos'||Number(i.qty)<=Number(i.min))&&[i.name,i.sku,i.category].some(v=>String(v||'').toLowerCase().includes(q))));bindStockActions($('#stocktable'))}$('#stocksearch').oninput=refresh;$('#stockfilter').onchange=refresh;bindStockActions(p)}
function stockTable(items){return items.length?`<div class="tablewrap"><table><thead><tr><th>Producto</th><th>SKU</th><th>Categoría</th><th>Existencia</th><th>Mínimo</th><th>Costo</th><th>Acciones</th></tr></thead><tbody>${items.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td>${esc(i.sku||'—')}</td><td>${esc(i.category||'—')}</td><td>${Number(i.qty)<=Number(i.min)?'<span class="pill orange">':''}${esc(i.qty)}${Number(i.qty)<=Number(i.min)?'</span>':''}</td><td>${esc(i.min)}</td><td>${money(i.cost)}</td><td><div class="actions"><button class="secondary small" data-stockedit="${i.id}">Editar</button><button class="ghost small" data-stockmove="${i.id}">Ajustar</button>${isAdmin()?`<button class="danger small" data-stockdel="${i.id}">Borrar</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay productos en inventario. Agrega el primero con el botón superior.</div>'}
function bindStockActions(root=document){root.querySelectorAll('[data-stockedit]').forEach(b=>b.onclick=()=>openStock(b.dataset.stockedit));root.querySelectorAll('[data-stockmove]').forEach(b=>b.onclick=()=>{const i=db.inventory.find(x=>x.id===b.dataset.stockmove);showModal('Ajustar existencia',`<p><b>${esc(i.name)}</b> · Existencia actual: ${i.qty}</p><form id="moveform"><div class="field"><label>CAMBIO DE UNIDADES (+ entrada / - salida)</label><input name="delta" type="number" step="1" required placeholder="Ej. 5 o -2"></div><button>Aplicar ajuste</button></form>`);$('#moveform').onsubmit=e=>{e.preventDefault();const d=Number(new FormData(e.target).get('delta'));if(i.qty+d<0){toast('La existencia no puede ser negativa');return}i.qty+=d;save();log('Ajustó inventario: '+i.name+' ('+(d>0?'+':'')+d+')');closeModal();renderApp()}});root.querySelectorAll('[data-stockdel]').forEach(b=>b.onclick=()=>{if(!isAdmin())return;if(confirm('¿Eliminar producto?')){db.inventory=db.inventory.filter(x=>x.id!==b.dataset.stockdel);save();log('Eliminó producto de inventario');renderApp()}})}
function openStock(id=null){const old=db.inventory.find(i=>i.id===id),i=old||{id:'I-'+uid(),name:'',sku:'',category:'Refacción',qty:0,min:1,cost:0};showModal(old?'Editar producto':'Agregar producto',`<form id="stockform"><div class="formgrid"><div class="field span2"><label>NOMBRE DEL PRODUCTO *</label><input name="name" value="${esc(i.name)}" required></div><div class="field"><label>SKU / CÓDIGO</label><input name="sku" value="${esc(i.sku)}"></div><div class="field"><label>CATEGORÍA</label><select name="category">${['Refacción','Accesorio','Herramienta','Consumible','Otro'].map(s=>`<option ${i.category===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>EXISTENCIA</label><input name="qty" type="number" min="0" step="1" value="${i.qty}" required></div><div class="field"><label>STOCK MÍNIMO</label><input name="min" type="number" min="0" step="1" value="${i.min}" required></div><div class="field"><label>COSTO UNITARIO (MXN)</label><input name="cost" type="number" min="0" step=".01" value="${i.cost}"></div></div><button>Guardar producto</button></form>`);$('#stockform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(i,{name:f.get('name').trim(),sku:f.get('sku').trim(),category:f.get('category'),qty:Number(f.get('qty')),min:Number(f.get('min')),cost:Number(f.get('cost')||0)});if(!old)db.inventory.unshift(i);save();log((old?'Editó':'Agregó')+' producto: '+i.name);closeModal();renderApp();toast('Inventario actualizado')}}
function clientsPage(p){p.innerHTML=`<div class="pagehead"><div><h3>Clientes</h3><div class="sub">Clientes registrados al crear órdenes de trabajo.</div></div></div><div class="toolbar"><input id="clientsearch" placeholder="Buscar cliente o teléfono..."></div><div id="clienttable">${clientTable(db.clients)}</div>`;$('#clientsearch').oninput=e=>$('#clienttable').innerHTML=clientTable(db.clients.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(e.target.value.toLowerCase())))}
function clientTable(items){return items.length?`<div class="tablewrap"><table><thead><tr><th>Nombre / empresa</th><th>Teléfono</th><th>Tipo</th><th>Órdenes</th><th>Acciones</th></tr></thead><tbody>${items.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'—')}</td><td>${c.wholesale?'<span class="pill blue">Mayorista</span>':'Cliente'}</td><td>${db.orders.filter(o=>o.phone&&o.phone===c.phone).length}</td><td><button class="secondary small" data-clientwa="${c.id}">WhatsApp</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Los clientes aparecerán aquí cuando registres órdenes.</div>'}
function usersPage(p){if(!isAdmin()){p.innerHTML='<div class="notice">No tienes permisos para administrar usuarios.</div>';return}p.innerHTML=`<div class="pagehead"><div><h3>Usuarios y permisos</h3><div class="sub">Administra cuentas y activa técnicos con privilegios reducidos.</div></div><button id="adduser">＋ Crear usuario</button></div><div class="notice">El administrador puede editar y eliminar datos. Los técnicos pueden registrar y actualizar órdenes, pero no administrar usuarios ni borrar información de inventario.</div><div class="card">${db.users.map(u=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)"><div><b>${esc(u.name)}</b><div class="sub">@${esc(u.username)} · ${u.role==='admin'?'Administrador':'Técnico'} · ${u.active?'<span class="pill green">Activo</span>':'<span class="pill red">Inactivo</span>'}</div></div><div class="actions"><button class="secondary small" data-useredit="${u.id}">Editar</button>${u.id!=='U-ADMIN'?`<button class="ghost small" data-usertoggle="${u.id}">${u.active?'Desactivar':'Activar'}</button><button class="danger small" data-userdel="${u.id}">Eliminar</button>`:''}</div></div>`).join('')}</div><div class="footnote">Aviso: esta versión inicial es para uso local. Las contraseñas se guardan en el navegador; no la uses como sistema multiusuario seguro para una red de taller.</div>`;$('#adduser').onclick=()=>openUser();p.querySelectorAll('[data-useredit]').forEach(b=>b.onclick=()=>openUser(b.dataset.useredit));p.querySelectorAll('[data-usertoggle]').forEach(b=>b.onclick=()=>{const u=db.users.find(x=>x.id===b.dataset.usertoggle);u.active=!u.active;save();log((u.active?'Activó':'Desactivó')+' usuario '+u.username);renderApp()});p.querySelectorAll('[data-userdel]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar cuenta?')){db.users=db.users.filter(x=>x.id!==b.dataset.userdel);save();log('Eliminó una cuenta de usuario');renderApp()}})}
function openUser(id=null){const old=db.users.find(u=>u.id===id),u=old||{id:'U-'+uid(),name:'',username:'',password:'',role:'tech',active:true};showModal(old?'Editar usuario':'Crear usuario',`<form id="userform"><div class="field"><label>NOMBRE COMPLETO</label><input name="name" value="${esc(u.name)}" required></div><div class="field"><label>USUARIO PARA INICIAR SESIÓN</label><input name="username" value="${esc(u.username)}" required ${old?'readonly':''}></div><div class="field"><label>${old?'NUEVA CONTRASEÑA (dejar en blanco para conservar)':'CONTRASEÑA'}</label><input name="password" type="password" ${old?'':'required'} minlength="6"></div><div class="field"><label>ROL</label><select name="role"><option value="tech" ${u.role==='tech'?'selected':''}>Técnico — privilegios reducidos</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrador — acceso completo</option></select></div><button>Guardar usuario</button></form>`);$('#userform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),username=String(f.get('username')).trim();if(db.users.some(x=>x.username.toLowerCase()===username.toLowerCase()&&x.id!==u.id)){toast('Ese usuario ya existe');return}Object.assign(u,{name:String(f.get('name')).trim(),username,role:f.get('role')});if(f.get('password'))u.password=f.get('password');if(!old)db.users.push(u);save();log((old?'Editó':'Creó')+' usuario '+u.username);closeModal();renderApp()}}
function settingsPage(p){if(!isAdmin()){p.innerHTML='<div class="notice">Solo el administrador puede cambiar la configuración.</div>';return}p.innerHTML=`<div class="pagehead"><div><h3>Configuración y respaldos</h3><div class="sub">Personaliza el taller y protege tus datos.</div></div></div><div class="grid two"><div class="card"><h4 class="section-title">Datos del taller</h4><form id="settingsform"><div class="field"><label>NOMBRE COMERCIAL</label><input name="shop" value="${esc(db.settings.shop)}" required></div><div class="field"><label>TEMA VISUAL</label><select name="theme"><option value="light" ${db.settings.theme==='light'?'selected':''}>Claro</option><option value="dark" ${db.settings.theme==='dark'?'selected':''}>Oscuro</option></select></div><button>Guardar configuración</button></form></div><div class="card"><h4 class="section-title">Respaldo de datos</h4><p class="sub">Exporta órdenes, clientes, inventario y usuarios a un archivo JSON. Guárdalo en un lugar privado; contiene información de clientes.</p><div class="actions"><button id="export">⬇ Exportar respaldo</button><button class="secondary" id="import">⬆ Importar respaldo</button><input type="file" id="importfile" accept=".json,application/json" class="hidden"></div><div class="notice" style="margin-top:15px">No publiques el archivo de respaldo en GitHub ni lo compartas en enlaces públicos. Para restaurar, importa un respaldo creado desde esta aplicación.</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h4 class="section-title">Zona de riesgo</h4><p class="sub">Elimina todos los datos locales de esta aplicación. Esta acción no se puede deshacer.</p><button class="danger" id="reset">Borrar todos los datos locales</button></div></div><div class="card" style="margin-top:16px"><h4 class="section-title">Qué funciona en esta versión</h4><div class="activity"><div class="activity-item"><div class="dot"></div><div><strong>Órdenes y evidencias</strong><span>Registro local, seguimiento de estado y archivos de evidencia limitados por el espacio del navegador.</span></div></div><div class="activity-item"><div class="dot"></div><div><strong>WhatsApp</strong><span>Abre WhatsApp con un mensaje preparado; una persona debe revisarlo y enviarlo.</span></div></div><div class="activity-item"><div class="dot"></div><div><strong>Consulta externa y notificaciones automáticas</strong><span>Requieren una base de datos y un servicio web. No están activadas en modo local.</span></div></div></div></div>`;
$('#settingsform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.settings.shop=f.get('shop').trim();db.settings.theme=f.get('theme');save();log('Actualizó la configuración');renderApp();toast('Configuración guardada')};
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='keyphone-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Respaldo exportado')};
$('#import').onclick=()=>$('#importfile').click();$('#importfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d.users||!d.orders||!d.inventory)throw Error();if(confirm('Importar reemplazará todos los datos actuales. ¿Continuar?')){db=d;save();state.user=null;render();toast('Respaldo importado')}}catch(err){toast('Archivo de respaldo inválido')}};
$('#reset').onclick=()=>{if(confirm('¿Estás seguro? Se borrarán órdenes, clientes, inventario y usuarios.')){localStorage.removeItem(KEY);db=fresh();state.user=null;render();toast('Datos locales borrados')}};
}
function showModal(title,body){$('#modalroot').innerHTML=`<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h3>${esc(title)}</h3><button class="close" id="modalclose" aria-label="Cerrar">×</button></div>${body}</div></div>`;$('#modalclose').onclick=closeModal;$('#modalback').onclick=e=>{if(e.target.id==='modalback')closeModal()}}
function closeModal(){$('#modalroot').innerHTML=''}
document.addEventListener('click',e=>{const b=e.target.closest('[data-clientwa]');if(b){const c=db.clients.find(x=>x.id===b.dataset.clientwa);if(c&&c.phone)window.open('https://wa.me/'+c.phone.replace(/\D/g,''),'_blank','noopener');else toast('Este cliente no tiene teléfono registrado')}});
window.addEventListener('beforeunload',()=>save());
render();
})();
</script>
</body>
</html>
